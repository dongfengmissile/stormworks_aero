[package]
name = "stormworks_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared by the Stormworks plugins: part definitions, vehicle files, voxels, joints and poses."

[lib]
name = "stormworks_core"

[features]
logging = []
# Settings and key bindings for the proxy mod loader's manager (`swml`).
swml = ["dep:imgui"]

[target.'cfg(windows)'.dependencies]
imgui = { version = "0.12", optional = true }
minhook = "0.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
